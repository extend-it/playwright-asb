name: service-bus-tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start Service Bus emulator
        run: docker compose -f docker/docker-compose.yaml up -d
      - name: Wait for emulator
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:5300/health && exit 0
            sleep 5
          done
          docker logs servicebus-emulator
          exit 1
      - run: npx playwright test
        env:
          SERVICEBUS_CONNECTION_STRING: "Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
      - name: Emulator logs on failure
        if: failure()
        run: docker logs servicebus-emulator
